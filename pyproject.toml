[project]
name = "django-pg-sse"
description = "Server-sent events for Django over PostgreSQL LISTEN/NOTIFY, with replay after reconnects."
authors = [{ name = "Oliver Andrich", email = "oliver@andrich.me" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["django", "sse", "server-sent events", "postgresql", "htmx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
]
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
  # The oldest Django release with security support.
  "django>=5.2",
  # AsyncConnection.notifies() and the connection pool need psycopg 3.
  # The pool extra runs the queries of opening streams in parallel.
  # 3.3.9 bounds the wait after a cancelled query, which the LISTEN health check relies on.
  "psycopg[pool]>=3.3.9",
]

[project.urls]
Documentation = "https://django-pg-sse.readthedocs.io/"
Repository = "https://github.com/oliverandrich/django-pg-sse"
Changelog = "https://github.com/oliverandrich/django-pg-sse/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "django-stubs>=6.0.2",
    "psycopg[binary]>=3.2",
    "pytest-cov>=5.0.0",
    "pytest-django>=4.14.0",
    "pytest-randomly>=3.15.0",
    "pytest-timeout>=2.3.1",
    "pytest>=8.3.3",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

# hatchling falls back to .gitignore for file selection, so tracking the agent
# instructions would otherwise ship them in every source release.
[tool.hatch.build.targets.sdist]
exclude = ["AGENTS.md", "CLAUDE.md"]

# basedpyright (also read by pyright)
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
reportPrivateUsage = "warning"
# strict leaves this at "none", so suppressions outlive the upstream bug they
# were added for. Fail instead, and they get removed when they stop applying.
reportUnnecessaryTypeIgnoreComment = "error"
# strict leaves this at "none" too, so deprecated APIs and overloads pass unnoticed.
reportDeprecated = "error"

# Ruff
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.format]
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "ARG", # flake8-unused-arguments
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DJ",  # flake8-django
    "E",   # pycodestyle
    "F",   # pyflakes
    "FBT", # flake8-boolean-trap
    "I",   # isort
    "N",   # pep8-naming
    "Q",   # flake8-quotes
    "TID", # flake8-tidy-imports
    "W",   # pycodestyle
    "YTT", # flake8-2020
]
ignore = [
    # Allow boolean positional values in function calls, like `dict.get(... True)`
    "FBT003",
]

[tool.ruff.lint.isort]
known-first-party = ["django_pg_sse"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["ARG001", "ARG002", "FBT001"]
"**/migrations/*" = ["ALL"]

# Pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src"]
testpaths = ["tests"]
timeout = 60

# Coverage
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
